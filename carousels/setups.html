<meta charset="utf-8">
<title>Dev Setup Reveals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: light "paper desk" slides with macOS window cards; 6 slides per carousel at 4:5 (432x540, exported 1080x1350) */
:root{
  --paper:#f4f1ea; --paper2:#ebe6db; --ink:#16131f; --muted:#6a6478; --line:#d9d2c3;
  --violet:#6b4ce8; --violet-soft:#e9e3ff; --sun:#ffd270; --green:#27a35a; --red:#e5534b;
  --page-bg:#ece9f5; --page-fg:#1b1532; --page-muted:#5e5878;
  --display:"Instrument Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page-bg:#0b0718;--page-fg:#ece9f5;--page-muted:#a39cc0;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#0b0718;--page-fg:#ece9f5;--page-muted:#a39cc0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page-bg);color:var(--page-fg);font-family:var(--display);margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:40px}
header h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 6px}
header p{margin:0;color:var(--page-muted);max-width:70ch}
.set{display:grid;gap:12px}
.set > h2{margin:0;font-size:1.2rem}
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.slide{flex:0 0 auto;width:432px;height:540px;position:relative;overflow:hidden;border-radius:4px;background:var(--paper);color:var(--ink);
  background-image:linear-gradient(var(--paper2) 1px,transparent 1px),linear-gradient(90deg,var(--paper2) 1px,transparent 1px);background-size:24px 24px}
.slide.zero{background:#100a21;color:#f5f2ea;background-image:none}
.head{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}
.zero .head{color:#a790ff}
.foot{position:absolute;bottom:14px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:12px;color:var(--ink)}
.zero .brand{color:#f5f2ea}
.brand i{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#a790ff,#6b4ce8);display:block}
.body{position:absolute;top:44px;left:22px;right:22px;bottom:40px;display:flex;flex-direction:column}
.win{background:#fff;border:1.5px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.zero .win{border-color:#a790ff;box-shadow:5px 5px 0 #6b4ce8;background:#181429}
.bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1.5px solid var(--ink);background:var(--paper2);font-family:var(--mono);font-size:10px;color:var(--muted)}
.zero .bar{background:#1f163d;border-color:#a790ff;color:#a790ff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.term{background:#16131f;color:#e8e4f4;font-family:var(--mono);font-size:12px;line-height:1.65;padding:12px 14px}
.term .g{color:#7ee2a8}.term .y{color:#ffd270}.term .m{color:#8d86a3}.term .v{color:#b9a6ff}
.h1{font-size:40px;line-height:1.04;font-weight:700;letter-spacing:-.025em;margin:0}
.h2{font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.015em;margin:0}
.p{font-size:15px;line-height:1.45;margin:0}
.muted{color:var(--muted)}
.hl{background:var(--sun);padding:0 4px}
.num{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--violet)}
.q{font-size:16.5px;line-height:1.42;font-weight:600;margin:0;padding:12px 14px}
.cite{font-family:var(--mono);font-size:9.5px;color:var(--muted);padding:0 14px 12px}
.why{display:flex;gap:10px;align-items:flex-start;margin-top:auto;background:var(--violet-soft);border:1.5px solid var(--violet);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.4}
.why b{font-family:var(--mono);font-size:10px;color:var(--violet);white-space:nowrap;margin-top:3px}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#fff;border:1.5px solid var(--ink);flex:0 0 auto}
.logo svg{width:20px;height:20px}
.logo.t{font-size:18px}
.toolrow{display:flex;align-items:center;gap:10px}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1.5px dashed var(--line);font-size:16px;line-height:1.35}
.check:first-child{border-top:0}
.box{width:18px;height:18px;border:2px solid var(--ink);border-radius:4px;margin-top:2px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--green)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:4px}
.zbtn{display:inline-flex;background:#ffd270;color:#100a21;font-weight:700;border-radius:999px;padding:9px 15px;font-size:13.5px}
.cal{font-family:var(--display);font-size:12px}
.cal .r{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;padding:5px 10px;border-top:1px dashed #3a3060}
.cal .r:first-child{border-top:0}
.cal .t{font-family:var(--mono);font-size:10px;color:#8d86a3}
.ev{border-radius:6px;padding:5px 8px;font-weight:600}
.ev.s{background:#fdecd3;color:#7a4b00}.ev.d{background:#6b4ce8;color:#fff}
.disc{font-family:var(--mono);font-size:8.3px;line-height:1.45;color:rgba(236,233,245,.72)}
</style>
<main class="wrap">
<header><h1>Dev setup reveals</h1><p>Four carousels (Boris has all 13 tips), in a light "dev desk" style. Real public quotes with dates, 3 things to steal, then Zero as our own pick on the last slide. No faces, no company logos.</p></header>
<div id="sets"></div>
</main>

const S=[
 {id:"boris",tweet:TWEET,who:"Boris Cherny",role:"creator & head of Claude Code, Anthropic",src:"X thread, 2 Jan 2026 · 8.2M views",
  hook:["The guy who built","<span class='hl'>Claude Code</span>","shared his full setup."],
  sub:"All 13 things. No secret prompts. He literally called it \"surprisingly vanilla\". Here it is in plain words.",
  file:"~/boris/setup.md",
  t:[
   {name:"Run 5 Claudes at once",logo:"claude",term:`[1] [2] [3] [4] [5]<br><span class="y">🔔 tab 3 needs input</span><br><span class="g">others keep working</span>`,
    q:"I run 5 Claudes in parallel in my terminal. I number my tabs 1-5, and use system notifications to know when a Claude needs input.",c:"@bcherny · 2 Jan 2026",why:"While one is thinking, you're on another. Numbered tabs so you never lose track."},
   {name:"More on the web and phone",logo:"📱",term:`<span class="m">morning:</span> start 3 tasks from phone<br><span class="m">later:</span> check in on laptop<br><span class="g">nothing waits for you</span>`,
    q:"I also start a few sessions from my phone (from the Claude iOS app) every morning and throughout the day, and check in on them later.",c:"@bcherny · 2 Jan 2026",why:"Kick off work from anywhere, check results later. Your laptop isn't the only place work happens."},
   {name:"Use the smartest model",logo:"🧠",term:`<span class="m">small model:</span> fast, needs fixing<br><span class="m">big model:</span> slower, gets it right<br><span class="g">big model wins overall</span>`,
    q:"I use Opus 4.5 with thinking for everything… since you have to steer it less and it's better at tool use, it is almost always faster than using a smaller model in the end.",c:"@bcherny · 2 Jan 2026",why:"Less babysitting means less fixing. Model names change, the idea doesn't."},
   {name:"One shared CLAUDE.md",logo:"github",term:`<span class="m"># CLAUDE.md</span><br>- use bun, not npm<br><span class="g">+ added after today's PR</span>`,
    q:"Our team shares a single CLAUDE.md for the Claude Code repo. We check it into git… Anytime we see Claude do something incorrectly we add it to the CLAUDE.md, so Claude knows not to do it next time.",c:"@bcherny · 2 Jan 2026",why:"Every mistake happens only once. The file gets smarter every week."},
   {name:"Teach it during code review",logo:"github",term:`<span class="m">PR #482 comment:</span><br>@.claude add "no default exports"<br><span class="g">✓ CLAUDE.md updated</span>`,
    q:"During code review, I will often tag @.claude on my coworkers' PRs to add something to the CLAUDE.md as part of the PR.",c:"@bcherny · 2 Jan 2026",why:"Code review teaches the AI too, not just your teammates."},
   {name:"Plan mode first",logo:"claude",term:`<span class="m">$</span> claude<br><span class="v">›</span> shift+tab <span class="y">×2</span><br><span class="g">⏸ plan mode on</span>`,
    q:"Most sessions start in Plan mode (shift+tab twice)… A good plan is really important!",c:"@bcherny · 2 Jan 2026",why:"Agree on the plan first. Then it can usually build it in one go."},
   {name:"Slash commands for repeat work",logo:"/",term:`<span class="m">.claude/commands/</span><br>  commit-push-pr.md<br><span class="g">used dozens of times a day</span>`,
    q:"I use slash commands for every 'inner loop' workflow that I end up doing many times a day… Claude and I use a /commit-push-pr slash command dozens of times every day.",c:"@bcherny · 2 Jan 2026",why:"If you type the same thing 10 times a day, make it a command."},
   {name:"Small helper agents",logo:"🤖",term:`<span class="v">code-simplifier</span> → cleans up<br><span class="v">verify-app</span> → tests end to end<br><span class="g">one job each</span>`,
    q:"code-simplifier simplifies the code after Claude is done working, verify-app has detailed instructions for testing Claude Code end to end.",c:"@bcherny · 2 Jan 2026",why:"Little helpers with one job each. Clean it up, then test it."},
   {name:"Auto-format with a hook",logo:"🪝",term:`<span class="m">PostToolUse:</span><br>bun run format || true<br><span class="g">✓ CI stays green</span>`,
    q:"We use a PostToolUse hook to format Claude's code… the hook handles the last 10% to avoid formatting errors in CI later.",c:"@bcherny · 2 Jan 2026",why:"Never fail CI because of a missing comma again."},
   {name:"Pre-approve safe commands",logo:"🔐",term:`<span class="m">/permissions</span><br>allow: npm test, git status…<br><span class="g">risky stuff still asks</span>`,
    q:"Instead, I use /permissions to pre-allow common bash commands that I know are safe… Most of these are checked into .claude/settings.json and shared with the team.",c:"@bcherny · 2 Jan 2026",why:"Say yes to the boring safe stuff once. Keep the risky stuff asking."},
   {name:"Let it use your tools",logo:"slack",term:`<span class="v">Slack</span> · <span class="v">BigQuery</span> · <span class="v">Sentry</span><br>via MCP + CLI<br><span class="g">you stay in one window</span>`,
    q:"Claude Code uses all my tools for me. It often searches and posts to Slack (via the MCP server), runs BigQuery queries… grabs error logs from Sentry, etc.",c:"@bcherny · 2 Jan 2026",why:"Fewer tabs for you. The agent goes to the tools so you don't have to."},

function fr(s,i,inner,cls=""){const N=s.t.length+3;return `<section class="slide ${cls}" data-set="${s.id}" data-i="${i}"><div class="head"><span>${cls?"// our pick":"// "+s.file}</span><span>${i}/${N}</span></div><div class="body">${inner}</div><div class="foot"><span class="brand"><i></i>Zero</span><span>${i===1?"swipe →":(i<N?"source: "+s.src:"")}</span></div></section>`;}
function slides(s){
 const a=[];
 a.push(fr(s,1,`
  <p class="tag" style="align-self:flex-start">setup reveal</p>
  <h2 class="h1" style="margin-top:14px;${s.tweet?"font-size:33px":""}">${s.hook.join("<br>")}</h2>
  <p class="p muted" style="margin-top:10px;${s.tweet?"font-size:13.5px":""}">${s.tweet?"All 13 things he shared, in plain words. Swipe →":s.sub}</p>
  ${s.tweet?`<img src="${s.tweet}" alt="Boris Cherny's original post on X" style="margin-top:auto;margin-bottom:8px;width:94%;align-self:center;border:1.5px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.2deg)">`:""}
  <div style="margin-top:auto;${s.tweet?"display:none":""}">${W(s.file,`<div class="term"><span class="m">who:</span> ${s.who}<br><span class="m">role:</span> ${s.role}<br><span class="m">source:</span> ${s.src}<br><span class="g">${s.t.length===3?"3 things worth stealing":"all "+s.t.length+" things, one per slide"} →</span></div>`)}</div>`));
 s.t.forEach((t,k)=>a.push(fr(s,k+2,`
  <div class="toolrow">${L(t.logo)}<div><div class="num">${String(k+1).padStart(2,"0")} / ${String(s.t.length).padStart(2,"0")}</div><h2 class="h2">${t.name}</h2></div></div>
  <div style="margin-top:12px">${W("terminal",`<div class="term">${t.term}</div>`)}</div>
  <div class="win" style="margin-top:14px;box-shadow:3px 3px 0 var(--ink)"><p class="q">“${t.q}”</p><div class="cite">— ${s.who} · ${t.c}</div></div>
  <div class="why"><b>WHY →</b><span>${t.why}</span></div>`)));
 a.push(fr(s,s.t.length+2,`
  <p class="tag" style="align-self:flex-start">tl;dr, save this</p>
  <h2 class="h2" style="margin-top:12px">${s.tldrTitle||s.who.split(" ")[0]+"'s setup in 3 lines"}</h2>
  <div class="win" style="margin-top:16px;padding:6px 14px">${s.tldr.map(x=>`<div class="check"><span class="box">✓</span><span>${x}</span></div>`).join("")}</div>
  <p class="p muted" style="margin-top:auto;font-size:13px">Which one are you trying first? Tell us in the comments.</p>`));
 a.push(fr(s,s.t.length+3,`
  <p style="font-family:var(--mono);font-size:11px;color:#ffd270;margin:0">our pick, not ${s.id==="cassidy"?"hers":"his"}</p>
  <h2 class="h2" style="margin-top:10px;color:#f5f2ea">${s.zero}</h2>
  <p class="p" style="margin-top:10px;color:#d4d0f1;font-size:14px">${s.zline}</p>
  <div style="margin-top:14px">${W("calendar",`<div class="cal"><div class="r"><span class="t">09:45</span><span class="ev s">"can you check this?" → task</span></div><div class="r"><span class="t">10–12</span><span class="ev d">Deep work · protected</span></div></div>`)}</div>
  <div style="margin-top:14px"><span class="zbtn">Try Zero free →</span></div>
  <p class="disc" style="margin-top:auto">${s.who} is not affiliated with Zero and does not endorse it. Tools and quotes are from their public ${s.src.split(",")[0]} (${s.src}). Zero is our own product.</p>`,"zero"));
 return a.join("");
}
document.getElementById("sets").innerHTML=S.map((s,n)=>`<div class="set"><h2>${n+1}. ${s.who}</h2><div class="strip">${slides(s)}</div></div>`).join("");
