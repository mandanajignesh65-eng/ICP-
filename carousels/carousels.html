<title>Zero Founder Carousels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Azeret+Mono:wght@500;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: page = stack of carousels; each carousel = row of 5 slides at 4:5 (drawn 432x540, exported 1080x1350) */
:root{
  --ink:#100a21; --ink2:#181429; --violet:#6b4ce8; --violet2:#8061ff; --lilac:#a790ff; --mist:#d4d0f1;
  --paper:#f5f2ea; --sun:#ffd270; --coral:#f88460;
  --page-bg:#ece9f5; --page-fg:#1b1532; --page-muted:#5e5878;
  --display:"Instrument Sans",system-ui,sans-serif; --mono:"Azeret Mono",ui-monospace,monospace; --hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page-bg:#0b0718;--page-fg:#ece9f5;--page-muted:#a39cc0;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#0b0718;--page-fg:#ece9f5;--page-muted:#a39cc0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page-bg);color:var(--page-fg);font-family:var(--display);margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:40px}
header h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--page-muted);max-width:70ch}
.set{display:grid;gap:12px}
.set > h2{margin:0;font-size:1.2rem}
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.slide{flex:0 0 auto;width:432px;height:540px;position:relative;overflow:hidden;border-radius:6px;
  background:var(--ink);color:var(--paper);background-image:radial-gradient(rgba(167,144,255,.14) 1px,transparent 1.3px);background-size:18px 18px}
.slide.cta{background:linear-gradient(160deg,#311b67 0%,#5629c1 60%,#6b4ce8 100%)}
.top{position:absolute;top:18px;left:24px;right:24px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--lilac)}
.bot{position:absolute;bottom:16px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9px;color:rgba(212,208,241,.65)}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--paper)}
.logo i{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,var(--lilac),var(--violet));display:block}
.body{position:absolute;top:50px;left:24px;right:24px;bottom:44px;display:flex;flex-direction:column}
.h1{font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.02em;margin:0}
.h2{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.015em;margin:0}
.p{font-size:17px;line-height:1.45;color:var(--mist);margin:0}
.sun{color:var(--sun)} .lil{color:var(--lilac)}
.hand{font-family:var(--hand);font-size:26px;color:var(--sun);line-height:1.05;margin:0}
.note{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--lilac);border-left:2px solid var(--violet2);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:#fbfaff;border-radius:16px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#1b1532;font-weight:600;font-size:12.5px;text-align:center;padding:8px;box-shadow:0 6px 0 rgba(107,76,232,.45)}
.tile svg{width:44px;height:44px}
.tile .txt{width:44px;height:44px;border-radius:12px;background:#ece8fc;color:#5629c1;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px}
.quote{font-size:23px;line-height:1.32;font-weight:600;margin:0}
.qmark{font-family:Georgia,serif;font-size:96px;line-height:.55;color:var(--violet2);height:44px}
.src{font-family:var(--mono);font-size:10.5px;color:var(--lilac)}
.cal{background:#fbfaff;color:#1b1532;border-radius:12px;padding:10px 12px;font-size:12px;box-shadow:0 12px 30px rgba(16,10,33,.35)}
.cal .row{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;min-height:30px;border-top:1px dashed #e1ddf0}
.cal .row:first-child{border-top:0}
.cal .t{font-family:var(--mono);font-size:10px;color:#7d769a}
.ev{border-radius:7px;padding:6px 8px;font-weight:600}
.ev.deep{background:#6b4ce8;color:#fff} .ev.mt{background:#e7e4f0;color:#5e5878;text-decoration:line-through}
.btn{display:inline-flex;background:var(--sun);color:var(--ink);font-weight:700;border-radius:999px;padding:10px 16px;font-size:14px}
.disc{font-family:var(--mono);font-size:8.5px;line-height:1.45;color:rgba(236,233,245,.75)}
</style>

<main class="wrap">
<header>
  <h1>Founder carousels for Zero</h1>
  <p>Six carousels, 5 slides each. Story first, real advice in the middle, Zero only on the last slide. Doodle avatars are drawings, not photos. Swipe each row sideways.</p>
</header>
<div id="sets"></div>
</main>
